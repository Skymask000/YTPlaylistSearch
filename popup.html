<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>YT Playlist Search</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
<div id="app">
  <header id="app-header">
    <h1>YT Playlist Search</h1>
    <span id="font-controls">
      <button id="font-smaller" type="button" title="Smaller text">A&minus;</button>
      <button id="font-larger" type="button" title="Larger text">A+</button>
    </span>
  </header>

  <div id="identity-strip">
    <img id="identity-avatar" alt="" hidden />
    <span id="identity-name"></span>
    <button id="sign-out-btn" type="button" hidden>Sign out</button>
    <button id="add-account-btn" type="button" hidden>Add account</button>
    <button id="sign-in-btn" type="button" hidden>Sign in with Google</button>
    <span id="signed-out-cta" hidden>Sign in to search your playlists.</span>
  </div>

  <fieldset id="source-fieldset">
    <legend>Playlist source</legend>
    <label><input type="radio" name="source" id="source-mine" value="mine" checked /> My playlists</label>
    <label><input type="radio" name="source" id="source-link" value="link" /> Link</label>
  </fieldset>

  <div id="mine-area">
    <div id="playlist-row">
      <select id="playlist-select"></select>
      <button id="refresh-btn" type="button" title="Re-fetch from YouTube, ignoring the cache">Refresh Playlists</button>
    </div>
    <div id="freshness"><span id="last-refreshed"></span></div>
  </div>

  <div id="link-area" hidden>
    <input id="link-input" type="text" placeholder="Paste a YouTube playlist or watch URL…" />
  </div>

  <fieldset id="scope-fieldset">
    <legend>Search in</legend>
    <div id="scope-grid">
      <label title="The video's title"><input type="checkbox" id="scope-song" checked /> Song name</label>
      <label title="The video's own description text (first 500 characters) — not the channel's"><input type="checkbox" id="scope-description" /> Song description</label>
      <label title="The channel that uploaded the video"><input type="checkbox" id="scope-channel" /> Channel name</label>
      <label title="The title of the playlist the song sits in"><input type="checkbox" id="scope-playlist" /> Playlist name</label>
    </div>
  </fieldset>

  <!-- U+FE0E (variation selector-15) after the glyph asks for the monochrome
       text form rather than the colour emoji form -->
  <input id="filter-input" type="search" placeholder="🔍︎ type to filter…" />

  <div id="progress-container" hidden>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-text"></div>
  </div>

  <div id="results"></div>

  <div id="status-line" role="status" aria-live="polite"></div>

</div>

  <script type="module" src="popup.js"></script>
</body>
</html>
